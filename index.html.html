<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sabor Norteñito POS — Sistema Integral v3.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="manifest" id="dynamic-manifest" />
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media print {
      body * { visibility: hidden; }
      #print-ticket-area, #print-ticket-area * { visibility: visible; }
      #print-ticket-area {
        position: fixed; left: 0; top: 0; width: 80mm; padding: 4mm;
        background: #fff; color: #000; font-family: monospace; font-size: 12px;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen select-none">

  <div id="app"></div>
  <div id="print-ticket-area" class="hidden"></div>

  <script>
    (function setupPWA() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#ea580c"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-size="250" font-family="sans-serif" font-weight="bold" fill="#ffffff">SN</text></svg>`;
      const iconUrl = "data:image/svg+xml;base64," + btoa(iconSvg);
      const manifest = {
        name: "Sabor Norteñito POS",
        short_name: "SaborNorteñito",
        start_url: "./",
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#ea580c",
        icons: [{ src: iconUrl, sizes: "512x512", type: "image/svg+xml" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
      document.getElementById("dynamic-manifest").setAttribute("href", URL.createObjectURL(blob));
    })();

    const STORAGE_KEY = "sabor_nortenito_pos_v3";
    const channel = ("BroadcastChannel" in window) ? new BroadcastChannel("sn_pos_sync_v3") : null;
    let supabaseClient = null;
    let supabaseChannel = null;

    const DEFAULT_STATE = {
      businessName: "SABOR NORTEÑITO",
      shiftActive: true,
      shiftLastChanged: new Date().toLocaleString("es-PE"),
      yapeNumber: "987 654 321",
      plinNumber: "987 654 321",
      cloudConfig: {
        enabled: false,
        url: "",
        anonKey: "",
        roomId: "sabor-nortenito-principal",
        lastSync: ""
      },
      users: [
        { id: "u1", name: "Kevin (Admin)", role: "admin", pin: "1111", active: true },
        { id: "u2", name: "Carlos (Mesero 1)", role: "mesero", pin: "2222", active: true },
        { id: "u3", name: "Lucía (Mesera 2)", role: "mesero", pin: "3333", active: true },
        { id: "u4", name: "Cocina Principal", role: "cocina", pin: "4444", active: true },
        { id: "u5", name: "Caja Principal", role: "caja", pin: "5555", active: true }
      ],
      tables: [
        { id: "m1", name: "Mesa 1", zone: "Salón", status: "libre" },
        { id: "m2", name: "Mesa 2", zone: "Salón", status: "libre" },
        { id: "m3", name: "Mesa 3", zone: "Salón", status: "libre" },
        { id: "m4", name: "Mesa 4", zone: "Salón", status: "libre" },
        { id: "m5", name: "Mesa 5", zone: "Terraza", status: "libre" },
        { id: "m6", name: "Mesa 6", zone: "Terraza", status: "libre" },
        { id: "m7", name: "Barra 1", zone: "Barra", status: "libre" },
        { id: "m8", name: "Para Llevar 1", zone: "Delivery / Llevar", status: "libre" }
      ],
      menu: [
        { id: "p1", name: "Ceviche Norteño Mixto", category: "Marinos y Entradas", price: 25.00, available: true },
        { id: "p2", name: "Cabrito a la Norteña con Frejoles", category: "Platos de Fondo", price: 28.00, available: true },
        { id: "p3", name: "Arroz con Pato a la Chiclayana", category: "Platos de Fondo", price: 26.00, available: true },
        { id: "p4", name: "Sudado de Pescado Norteño", category: "Platos de Fondo", price: 24.00, available: true },
        { id: "p5", name: "Lomo Saltado Clásico", category: "Platos de Fondo", price: 24.00, available: true },
        { id: "p6", name: "Tequeños con Guacamole (6 und)", category: "Piqueos y Entradas", price: 12.00, available: true },
        { id: "p7", name: "Chicha de Jora / Morada Jarra 1L", category: "Bebidas", price: 10.00, available: true },
        { id: "p8", name: "Inca Kola 500ml", category: "Bebidas", price: 4.50, available: true }
      ],
      activeOrders: {},
      kitchenTickets: [],
      salesHistory: [],
      cashRegister: {
        isOpen: true,
        openedAt: new Date().toLocaleString("es-PE"),
        openedBy: "Kevin (Admin)",
        openingCash: 150.00,
        expenses: []
      },
      cashClosures: [],
      auditLogs: [
        { id: "log1", time: new Date().toLocaleTimeString("es-PE"), date: new Date().toLocaleDateString("es-PE"), user: "Sistema", action: "Sistema Sabor Norteñito POS v3.0 inicializado." }
      ]
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        return {
          ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
          ...parsed,
          cloudConfig: { ...DEFAULT_STATE.cloudConfig, ...(parsed.cloudConfig || {}) }
        };
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    let state = loadState();
    let currentUser = null;
    let activeTab = "mesas";
    let selectedTableId = null;
    let menuCategoryFilter = "Todos";
    let menuSearchQuery = "";
    let checkoutModal = null;
    let pinBuffer = "";
    let loginError = "";

    function saveState(skipBroadcast = false, skipCloud = false) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (!skipBroadcast && channel) {
        channel.postMessage({ type: "SYNC_STATE", state });
      }
      if (!skipCloud && state.cloudConfig && state.cloudConfig.enabled) {
        pushStateToSupabase();
      }
    }

    async function connectSupabaseRealtime() {
      if (!state.cloudConfig || !state.cloudConfig.enabled || !state.cloudConfig.url || !state.cloudConfig.anonKey) return;
      try {
        if (!window.supabase) return;
        supabaseClient = window.supabase.createClient(state.cloudConfig.url.trim(), state.cloudConfig.anonKey.trim());
        await pullStateFromSupabase();

        if (supabaseChannel) {
          await supabaseClient.removeChannel(supabaseChannel);
        }
        const room = (state.cloudConfig.roomId || "sabor-nortenito-principal").trim();
        supabaseChannel = supabaseClient
          .channel("pos-room-" + room)
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "pos_sync_state", filter: "id=eq." + room },
            (payload) => {
              if (payload.new && payload.new.payload_json) {
                const remoteCloud = state.cloudConfig;
                state = {
                  ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
                  ...payload.new.payload_json,
                  cloudConfig: { ...remoteCloud, lastSync: new Date().toLocaleTimeString("es-PE") }
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                verifyCurrentUserAccess();
                render();
              }
            }
          )
          .subscribe();
      } catch (err) {
        console.warn("Error conectando nube Supabase:", err);
      }
    }

    async function pushStateToSupabase() {
      if (!supabaseClient || !state.cloudConfig.enabled) return;
      try {
        const room = (state.cloudConfig.roomId || "sabor-nortenito-principal").trim();
        const sanitized = { ...state, cloudConfig: { ...state.cloudConfig, anonKey: state.cloudConfig.anonKey } };
        await supabaseClient
          .from("pos_sync_state")
          .upsert({ id: room, payload_json: sanitized, updated_at: new Date().toISOString() }, { onConflict: "id" });
        state.cloudConfig.lastSync = new Date().toLocaleTimeString("es-PE");
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.warn("Error enviando a nube:", err);
      }
    }

    async function pullStateFromSupabase() {
      if (!supabaseClient || !state.cloudConfig.enabled) return;
      try {
        const room = (state.cloudConfig.roomId || "sabor-nortenito-principal").trim();
        const { data, error } = await supabaseClient
          .from("pos_sync_state")
          .select("payload_json")
          .eq("id", room)
          .single();
        if (!error && data && data.payload_json) {
          const localCloud = state.cloudConfig;
          state = {
            ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
            ...data.payload_json,
            cloudConfig: { ...localCloud, lastSync: new Date().toLocaleTimeString("es-PE") }
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          verifyCurrentUserAccess();
          render();
        }
      } catch (err) {
        console.warn("Error leyendo desde nube:", err);
      }
    }

    if (channel) {
      channel.onmessage = (ev) => {
        if (ev.data && ev.data.type === "SYNC_STATE") {
          state = ev.data.state;
          verifyCurrentUserAccess();
          render();
        }
      };
    }

    window.addEventListener("storage", (e) => {
      if (e.key === STORAGE_KEY) {
        state = loadState();
        verifyCurrentUserAccess();
        render();
      }
    });

    function addLog(action, customUser = null) {
      const now = new Date();
      state.auditLogs.unshift({
        id: "log_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        time: now.toLocaleTimeString("es-PE"),
        date: now.toLocaleDateString("es-PE"),
        user: customUser || (currentUser ? currentUser.name : "Sistema"),
        action
      });
      if (state.auditLogs.length > 400) state.auditLogs.pop();
    }

    function playBeep(freq = 880) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }

    function verifyCurrentUserAccess() {
      if (!currentUser) return;
      const freshUser = state.users.find(u => u.id === currentUser.id);
      if (!freshUser) {
        alert("Tu cuenta ha sido eliminada del portal por el Administrador.");
        currentUser = null;
        return;
      }
      if (!freshUser.active) {
        alert("Tu acceso al sistema ha sido desactivado por el Administrador.");
        currentUser = null;
        return;
      }
      if (freshUser.role !== "admin" && !state.shiftActive) {
        alert("La jornada laboral ha sido cerrada por el Administrador. Acceso bloqueado hasta el próximo turno.");
        currentUser = null;
        return;
      }
      currentUser = freshUser;
    }

    function handlePinDigit(digit) {
      if (pinBuffer.length < 4) {
        pinBuffer += digit;
        loginError = "";
        if (pinBuffer.length === 4) {
          attemptLogin(pinBuffer);
        }
        render();
      }
    }

    function attemptLogin(pin) {
      const user = state.users.find(u => u.pin === pin);
      if (!user) {
        loginError = "PIN incorrecto. Verifica tu código.";
        pinBuffer = "";
        return;
      }
      if (!user.active) {
        loginError = "Usuario desactivado o dado de baja. Contacta al Administrador.";
        pinBuffer = "";
        return;
      }
      if (user.role !== "admin" && !state.shiftActive) {
        loginError = "JORNADA CERRADA: El administrador cortó el acceso hasta el próximo turno.";
        pinBuffer = "";
        return;
      }
      currentUser = user;
      pinBuffer = "";
      loginError = "";
      if (user.role === "admin") activeTab = "admin";
      else if (user.role === "cocina") activeTab = "cocina";
      else if (user.role === "caja") activeTab = "caja";
      else activeTab = "mesas";
      addLog("Inició sesión en el sistema (" + user.role.toUpperCase() + ")", user.name);
      saveState();
      render();
    }

    function logout() {
      if (currentUser) {
        addLog("Cerró sesión", currentUser.name);
        saveState();
      }
      currentUser = null;
      selectedTableId = null;
      checkoutModal = null;
      render();
    }

    function openTable(tableId) {
      selectedTableId = tableId;
      if (!state.activeOrders[tableId]) {
        const tbl = state.tables.find(t => t.id === tableId);
        state.activeOrders[tableId] = {
          tableId,
          tableName: tbl.name,
          waiterName: currentUser.name,
          startedAt: new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" }),
          items: []
        };
      }
      render();
    }

    function addItemToOrder(productId) {
      if (!selectedTableId) return;
      const prod = state.menu.find(p => p.id === productId);
      if (!prod || !prod.available) return;
      const order = state.activeOrders[selectedTableId];
      const existing = order.items.find(i => i.productId === productId && !i.sentToKitchen && (i.note || "") === "");
      if (existing) {
        existing.qty += 1;
      } else {
        order.items.push({
          uid: "it_" + Date.now() + "_" + Math.random().toString(36).slice(2, 5),
          productId: prod.id,
          name: prod.name,
          price: prod.price,
          qty: 1,
          note: "",
          sentToKitchen: false
        });
      }
      const tbl = state.tables.find(t => t.id === selectedTableId);
      if (tbl.status === "libre") tbl.status = "ocupada";
      saveState();
      render();
    }

    function changeItemQty(itemUid, delta) {
      const order = state.activeOrders[selectedTableId];
      if (!order) return;
      const idx = order.items.findIndex(i => i.uid === itemUid);
      if (idx === -1) return;
      if (order.items[idx].sentToKitchen && currentUser.role !== "admin") {
        alert("Este plato ya fue enviado a cocina. Solo el Administrador puede descontarlo.");
        return;
      }
      order.items[idx].qty += delta;
      if (order.items[idx].qty <= 0) {
        order.items.splice(idx, 1);
      }
      if (order.items.length === 0) {
        const tbl = state.tables.find(t => t.id === selectedTableId);
        tbl.status = "libre";
        delete state.activeOrders[selectedTableId];
        selectedTableId = null;
      }
      saveState();
      render();
    }

    function setItemNote(itemUid) {
      const order = state.activeOrders[selectedTableId];
      if (!order) return;
      const item = order.items.find(i => i.uid === itemUid);
      if (!item) return;
      const note = prompt(`Nota para cocina (${item.name}):`, item.note || "");
      if (note !== null) {
        item.note = note.trim();
        saveState();
        render();
      }
    }

    function sendOrderToKitchen() {
      const order = state.activeOrders[selectedTableId];
      if (!order) return;
      const pendingItems = order.items.filter(i => !i.sentToKitchen);
      if (pendingItems.length === 0) {
        alert("No hay ítems nuevos por enviar a cocina.");
        return;
      }
      const ticket = {
        id: "KDS-" + Math.floor(1000 + Math.random() * 9000),
        tableId: order.tableId,
        tableName: order.tableName,
        waiterName: currentUser.name,
        createdAt: new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" }),
        timestamp: Date.now(),
        status: "pendiente",
        items: pendingItems.map(i => ({ ...i }))
      };
      pendingItems.forEach(i => { i.sentToKitchen = true; });
      const tbl = state.tables.find(t => t.id === selectedTableId);
      tbl.status = "cocina";
      state.kitchenTickets.unshift(ticket);
      addLog(`Envió comanda ${ticket.id} (${order.tableName}) a cocina`);
      playBeep(920);
      saveState();
      render();
    }

    function updateKitchenTicketStatus(ticketId, newStatus) {
      const ticket = state.kitchenTickets.find(t => t.id === ticketId);
      if (!ticket) return;
      ticket.status = newStatus;
      if (newStatus === "listo") {
        ticket.readyAt = new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
        const tbl = state.tables.find(t => t.id === ticket.tableId);
        if (tbl && tbl.status !== "libre") tbl.status = "listo";
        playBeep(1150);
      } else if (newStatus === "entregado") {
        ticket.deliveredAt = new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
        const tbl = state.tables.find(t => t.id === ticket.tableId);
        if (tbl && tbl.status !== "libre") tbl.status = "ocupada";
      }
      addLog(`Cocina marcó comanda ${ticket.id} (${ticket.tableName}) como ${newStatus.toUpperCase()}`);
      saveState();
      render();
    }

    function openCheckout(tableId) {
      const order = state.activeOrders[tableId];
      if (!order || order.items.length === 0) return;
      const subtotal = order.items.reduce((acc, i) => acc + i.price * i.qty, 0);
      checkoutModal = {
        tableId,
        method: "Yape",
        receivedCash: subtotal.toFixed(2),
        opCode: "",
        discount: 0
      };
      render();
    }

    function processPayment() {
      if (!checkoutModal) return;
      const order = state.activeOrders[checkoutModal.tableId];
      if (!order) return;
      const subtotal = order.items.reduce((acc, i) => acc + i.price * i.qty, 0);
      const discount = Math.max(0, Number(checkoutModal.discount) || 0);
      const total = Math.max(0, subtotal - discount);
      const received = Number(checkoutModal.receivedCash) || total;
      const change = checkoutModal.method === "Efectivo" ? Math.max(0, received - total) : 0;

      if (checkoutModal.method === "Efectivo" && received < total) {
        alert("El monto recibido en efectivo es menor al total a cobrar.");
        return;
      }

      const sale = {
        id: "BOL-" + Date.now().toString().slice(-6),
        date: new Date().toLocaleDateString("es-PE"),
        time: new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" }),
        tableName: order.tableName,
        waiterName: order.waiterName,
        cashierName: currentUser.name,
        method: checkoutModal.method,
        opCode: checkoutModal.opCode.trim(),
        items: order.items.map(i => ({ ...i })),
        subtotal,
        discount,
        total,
        received,
        change,
        status: "pagado"
      };

      state.salesHistory.unshift(sale);
      delete state.activeOrders[checkoutModal.tableId];
      const tbl = state.tables.find(t => t.id === checkoutModal.tableId);
      if (tbl) tbl.status = "libre";
      if (selectedTableId === checkoutModal.tableId) selectedTableId = null;

      addLog(`Cobró ${sale.id} (${sale.tableName}) por S/ ${total.toFixed(2)} vía ${sale.method}`);
      checkoutModal = null;
      saveState();
      render();
      printSaleTicket(sale.id);
    }

    function printSaleTicket(saleId) {
      const sale = state.salesHistory.find(s => s.id === saleId);
      if (!sale) return;
      const printArea = document.getElementById("print-ticket-area");
      printArea.innerHTML = `
        <div style="text-align:center; border-bottom:1px dashed #000; padding-bottom:6px; margin-bottom:6px;">
          <strong style="font-size:15px;">${state.businessName}</strong><br/>
          <span>Comprobante Interno: ${sale.id}</span><br/>
          <span>${sale.date} ${sale.time} | ${sale.tableName}</span><br/>
          <span>Atendido por: ${sale.waiterName}</span>
        </div>
        <div style="border-bottom:1px dashed #000; padding-bottom:6px; margin-bottom:6px;">
          ${sale.items.map(i => `
            <div style="display:flex; justify-content:space-between;">
              <span>${i.qty}x ${i.name}</span>
              <span>S/ ${(i.qty * i.price).toFixed(2)}</span>
            </div>
          `).join("")}
        </div>
        <div style="text-align:right;">
          <div>Subtotal: S/ ${sale.subtotal.toFixed(2)}</div>
          ${sale.discount > 0 ? `<div>Descuento: -S/ ${sale.discount.toFixed(2)}</div>` : ""}
          <strong style="font-size:14px;">TOTAL: S/ ${sale.total.toFixed(2)}</strong><br/>
          <div>Método: ${sale.method} ${sale.opCode ? `(Op: ${sale.opCode})` : ""}</div>
          ${sale.method === "Efectivo" ? `<div>Recibido: S/ ${sale.received.toFixed(2)} | Vuelto: S/ ${sale.change.toFixed(2)}</div>` : ""}
        </div>
        <div style="text-align:center; margin-top:8px;">¡Gracias por preferir Sabor Norteñito!</div>
      `;
      printArea.classList.remove("hidden");
      window.print();
      printArea.classList.add("hidden");
    }

    function voidSale(saleId) {
      if (currentUser.role !== "admin") return;
      const sale = state.salesHistory.find(s => s.id === saleId);
      if (!sale || sale.status === "anulado") return;
      const reason = prompt(`Motivo para anular la boleta ${sale.id} (S/ ${sale.total.toFixed(2)}):`);
      if (!reason || !reason.trim()) return;
      sale.status = "anulado";
      sale.voidReason = reason.trim();
      addLog(`ANULÓ boleta ${sale.id} por S/ ${sale.total.toFixed(2)}. Motivo: ${reason.trim()}`);
      saveState();
      render();
    }

    function addCashExpense() {
      const desc = prompt("Concepto del gasto de caja chica (ej. Hielo, Limones, Gas):");
      if (!desc || !desc.trim()) return;
      const amount = parseFloat(prompt("Monto gastado en Soles (ej. 15.50):"));
      if (isNaN(amount) || amount <= 0) return;
      state.cashRegister.expenses.unshift({
        id: "exp_" + Date.now(),
        time: new Date().toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" }),
        desc: desc.trim(),
        amount,
        user: currentUser.name
      });
      addLog(`Registró salida de caja: ${desc.trim()} (-S/ ${amount.toFixed(2)})`);
      saveState();
      render();
    }

    function closeCashShift() {
      const validSales = state.salesHistory.filter(s => s.status === "pagado");
      const totalYape = validSales.filter(s => s.method === "Yape").reduce((a, b) => a + b.total, 0);
      const totalPlin = validSales.filter(s => s.method === "Plin").reduce((a, b) => a + b.total, 0);
      const totalCash = validSales.filter(s => s.method === "Efectivo").reduce((a, b) => a + b.total, 0);
      const totalCard = validSales.filter(s => s.method === "Tarjeta").reduce((a, b) => a + b.total, 0);
      const totalExp = state.cashRegister.expenses.reduce((a, b) => a + b.amount, 0);
      const expectedCash = state.cashRegister.openingCash + totalCash - totalExp;

      const counted = parseFloat(prompt(`Arqueo de Efectivo.\nEfectivo esperado en caja: S/ ${expectedCash.toFixed(2)}\nIngresa el efectivo contado físico:`, expectedCash.toFixed(2)));
      if (isNaN(counted)) return;

      const closure = {
        id: "CIE-" + Date.now().toString().slice(-5),
        date: new Date().toLocaleString("es-PE"),
        closedBy: currentUser.name,
        totalYape,
        totalPlin,
        totalCard,
        totalCash,
        totalExp,
        expectedCash,
        countedCash: counted,
        diff: counted - expectedCash
      };
      state.cashClosures.unshift(closure);
      state.cashRegister.openingCash = counted;
      state.cashRegister.expenses = [];
      addLog(`Realizó cierre/arqueo de caja ${closure.id} (Diferencia: S/ ${closure.diff.toFixed(2)})`);
      saveState();
      render();
    }

    function toggleWorkShift() {
      if (currentUser.role !== "admin") return;
      const nextState = !state.shiftActive;
      const msg = nextState
        ? "¿Deseas ABRIR la jornada laboral de Sabor Norteñito? Todo el personal activo podrá volver a ingresar."
        : "¿Deseas CORTAR / CERRAR la jornada laboral ahora? Se bloqueará el acceso inmediato a meseros, cocina y caja hasta que vuelvas a abrir turno.";
      if (!confirm(msg)) return;
      state.shiftActive = nextState;
      state.shiftLastChanged = new Date().toLocaleString("es-PE");
      addLog(nextState ? "ABRIÓ la jornada laboral del local" : "CORTÓ / DESACTIVÓ el acceso de jornada laboral");
      saveState();
      render();
    }

    function addStaffMember() {
      const name = prompt("Nombre completo de la trabajadora o trabajador:");
      if (!name || !name.trim()) return;
      const role = prompt("Rol exacto (escribe: mesero, cocina, caja o admin):", "mesero");
      if (!["mesero", "cocina", "caja", "admin"].includes((role || "").toLowerCase().trim())) {
        alert("Rol inválido. Debe ser: mesero, cocina, caja o admin.");
        return;
      }
      const pin = prompt("Asigna un PIN de 4 dígitos para su ingreso (ej. 6666):");
      if (!pin || !/^\d{4}$/.test(pin.trim())) {
        alert("El PIN debe tener exactamente 4 números.");
        return;
      }
      if (state.users.some(u => u.pin === pin.trim())) {
        alert("Ese PIN ya está siendo usado por otro trabajador.");
        return;
      }
      state.users.push({
        id: "u_" + Date.now(),
        name: name.trim(),
        role: role.toLowerCase().trim(),
        pin: pin.trim(),
        active: true
      });
      addLog(`Creó cuenta de personal: ${name.trim()} (${role.toUpperCase()})`);
      saveState();
      render();
    }

    function toggleStaffActive(userId) {
      const u = state.users.find(x => x.id === userId);
      if (!u || u.id === currentUser.id) return;
      u.active = !u.active;
      addLog(`${u.active ? "Reactivó" : "Suspendió"} acceso al portal de ${u.name}`);
      saveState();
      render();
    }

    function deleteStaffMember(userId) {
      const u = state.users.find(x => x.id === userId);
      if (!u || u.id === currentUser.id) return;
      if (!confirm(`¿Eliminar definitivamente a "${u.name}" del portal (por renuncia o baja)?\nSe revocará su PIN y cerrará su acceso al instante.`)) return;
      state.users = state.users.filter(x => x.id !== userId);
      addLog(`ELIMINÓ DEFINITIVAMENTE del portal a ${u.name} (${u.role})`);
      saveState();
      render();
    }

      const name = prompt("Nombre del plato o bebida:");

      const category = prompt("Categoría (ej. Platos de Fondo, Marinos y Entradas, Bebidas, Piqueos):", "Platos de Fondo");

      state.menu.push({

        available: true

      const name = prompt("Nombre de la nueva mesa (ej. Mesa 9, Terraza 3):");

      const zone = prompt("Zona (ej. Salón, Terraza, Barra, Delivery / Llevar):", "Salón");

    function saveCloudConfigFromUI() {
      const urlInput = document.getElementById("sb-url-input");
      const keyInput = document.getElementById("sb-key-input");
      const roomInput = document.getElementById("sb-room-input");
      const enabledInput = document.getElementById("sb-enabled-input");
      if (!urlInput || !keyInput || !roomInput || !enabledInput) return;

      state.cloudConfig.url = urlInput.value.trim();
      state.cloudConfig.anonKey = keyInput.value.trim();
      state.cloudConfig.roomId = (roomInput.value.trim() || "sabor-nortenito-principal");
      state.cloudConfig.enabled = enabledInput.checked;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      if (state.cloudConfig.enabled) {
        connectSupabaseRealtime().then(() => {
          pushStateToSupabase();
          addLog("Activó sincronización en la nube entre dispositivos");
          saveState(false, true);
          render();
        });
      } else {
        addLog("Desactivó sincronización en la nube");
        saveState(false, true);
        render();
      }
    }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `Respaldo_SaborNortenito_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();

    function exportSalesCSV() {
      const rows = [["Boleta", "Fecha", "Hora", "Mesa", "Mesero", "Cajero", "Metodo", "Cod_Operacion", "Subtotal", "Descuento", "Total", "Estado"]];
      state.salesHistory.forEach(s => {
        rows.push([s.id, s.date, s.time, s.tableName, s.waiterName, s.cashierName, s.method, s.opCode || "-", s.subtotal.toFixed(2), s.discount.toFixed(2), s.total.toFixed(2), s.status]);
      });
      const csv = rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });

      a.href = URL.createObjectURL(blob);
      a.download = `Historial_Ventas_SaborNortenito_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    function renderCheckoutModal() {
      const order = state.activeOrders[checkoutModal.tableId];

      const subtotal = order.items.reduce((a, b) => a + b.price * b.qty, 0);
      const total = Math.max(0, subtotal - (Number(checkoutModal.discount) || 0));
      const change = checkoutModal.method === "Efectivo" ? Math.max(0, (Number(checkoutModal.receivedCash) || 0) - total) : 0;

      return `
        <div class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">

              <span class="text-sm text-slate-400">Total a Pagar:</span>
              <span class="text-2xl font-black text-emerald-400">S/ ${total.toFixed(2)}</span>

            ${(checkoutModal.method === "Yape" || checkoutModal.method === "Plin") ? `
              <div class="bg-purple-950/30 border border-purple-700/40 p-3 rounded-xl space-y-2">

                  <div class="text-lg font-black text-amber-400">S/ ${change.toFixed(2)}</div>

                <div class="flex gap-2">
                  <button onclick="addNewTable()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-orange-400">+ Mesa</button>
                  <button onclick="exportBackupJSON()" class="px-3 py-1.5 rounded-xl bg-blue-600/20 text-blue-400 text-xs font-bold">💾 Respaldo JSON</button>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto">
                ${state.tables.map(t => `
                  <div class="bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 text-xs flex justify-between items-center">
                    <span class="font-semibold text-white">${t.name}</span>
                    <span class="text-slate-400">${t.zone}</span>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    if (state.cloudConfig && state.cloudConfig.enabled) {
      connectSupabaseRealtime();
    }
    render();
  </script>
</body>
</html>
